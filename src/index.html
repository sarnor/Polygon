<!DOCTYPE html>
<html lang="en" class="ns">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.0">
    <style>
        .loader {
            z-index: 9999;
            position: fixed;
            width: 100dvw;
            height: 100dvh;
            background-color: #272727;
            display: flex;
            justify-content: center;
            align-items: center;

            div {
                color: white;
                font-size: 45px;

                span {
                    &:nth-child(n+2) {
                        animation: blink 1s infinite;
                    }

                    &:nth-child(2) {
                        animation-delay: 0.2s;
                    }

                    &:nth-child(3) {
                        animation-delay: 0.3s;
                    }

                    &:nth-child(4) {
                        animation-delay: 0.5s;
                    }
                }
            }
        }

        @keyframes blink {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- <div class="loader">
        <div><span>Loading</span><span>.</span><span>.</span><span>.</span></div>
    </div> -->
    <!-- <canvas id="canvas"></canvas> -->
    <div id="root">
        <header>
            <h1>
                Sarnor.GitHub.io
                <span>
                    Online radio
                </span>
            </h1>
        </header>
        <main>
            <div class="tracks-wrapper"></div>
            <div class="radio-control-panel">
                <div class="control-panel">
                    <button type="button" class="control btn-play">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button type="button" class="control btn-stop">
                        <i class="fa-solid fa-stop"></i>
                    </button>
                </div>
                <div class="track-name">
                </div>
            </div>
        </main>
    </div>
</body>

</html>
