<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .loader {
            z-index: 9999;
            position: fixed;
            width: 100dvw;
            height: 100dvh;
            background-color: #272727;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader>div {
            color: white;
            font-size: 45px;

            span:nth-child(n+2) {
                animation-name: rotation;
                animation-duration: 1s;
                animation-iteration-count: infinite;
                animation-timing-function: linear;
            }

            span:nth-child(2) {
                animation-delay: 0.2s;
            }

            span:nth-child(3) {
                animation-delay: 0.3s;
            }

            span:nth-child(4) {
                animation-delay: 0.5s;
            }
        }
    </style>
</head>

<body>

    <div class="loader">
        <!-- <div><span>Loading</span><span>.</span><span>.</span><span>.</span></div> -->
    </div>
    <canvas id="canvas"></canvas>
    <div id="root">
        <header>
            <h1>
                Sarnor.GitHub.io
                <span>
                    Online radio
                </span>
            </h1>
            <div class="ch">CH</div>
        </header>
        <main>
            <div class="tracks-wrapper"></div>
            <div class="radio-control-panel">
                <div class="control-panel">
                    <div class="control play">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <div class="control stop">
                        <i class="fa-solid fa-stop"></i>
                    </div>
                </div>
                <div class="track-name">

                </div>
            </div>
        </main>
    </div>
</body>

</html>
